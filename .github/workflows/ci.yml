name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Database Schema & Migration Verification
        run: |
          cd backend
          python -c "from app.core.database import engine, Base; from app.models.schema import *; Base.metadata.create_all(bind=engine); print('Schema valid')"

      - name: Run Test Suite
        env:
          AUTO_APPLY_ENABLED: "false"
          APPLICATION_APPROVAL_REQUIRED: "true"
          TELEGRAM_ENABLED: "false"
        run: |
          cd backend
          python -m pytest tests/ -v
